[pytest]
testpaths = tests
pythonpath = src .
addopts = -q
filterwarnings =
    ignore::DeprecationWarning

# tests/test_v3_edge_cases.py and tests/test_v3_integration.py are manual end-to-end
# scripts that execute at import time and require the git-ignored Datasets/ directory
# and the V3 checkpoint. They are excluded via collect_ignore in conftest.py.
